<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSNW — Апгрейдер скинов</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #202126;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
        }
        h1 {
            font-size: 26px;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .balance {
            background: #3A3F45;
            border: 1px solid #363940;
            padding: 16px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .balance .gold { color: #FFD700; }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            background: #3A3F45;
            border: 1px solid #363940;
            color: #fff;
            cursor: pointer;
            text-align: center;
            font-size: 16px;
            transition: 0.3s;
        }
        .tab:hover { background: #363940; }
        .tab.active { background: #42474B; border-color: #FFFFFF; }

        .section {
            display: none;
        }
        .section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .skin-card {
            background: #3A3F45;
            border: 1px solid #363940;
            padding: 12px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            position: relative;
        }
        .skin-card:hover {
            background: #363940;
            border-color: #FFFFFF;
            transform: translateY(-3px);
        }
        .skin-card.selected {
            border-color: #FFFFFF;
            background: #42474B;
        }
        .skin-card .img {
            width: 100%;
            height: 100px;
            background: #202126;
            border: 1px solid #363940;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            opacity: 0.5;
            overflow: hidden;
        }
        .skin-card .img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .skin-card .name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .skin-card .price {
            font-size: 13px;
            color: #FFD700;
        }
        .skin-card .quality {
            font-size: 11px;
            margin-top: 4px;
            text-transform: uppercase;
        }
        .quality-base { color: #5AB0FF; }
        .quality-pro { color: #FF4444; }
        .quality-legend { color: #C060FF; }
        .quality-myth { color: #FFD700; }

        .inv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }

        .empty {
            text-align: center;
            opacity: 0.5;
            padding: 30px;
            font-size: 14px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: #42474B;
            border: 1px solid #363940;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }
        .btn:hover { background: #363940; border-color: #FFFFFF; }
        .btn:disabled { opacity: 0.4; cursor: default; }
        .btn-danger {
            background: #2a1a1a;
            border-color: #5a2a2a;
            color: #ff6b6b;
        }
        .btn-danger:hover { background: #3a1a1a; border-color: #8a3a3a; }

        .inventory-label {
            font-size: 16px;
            margin-bottom: 12px;
            opacity: 0.7;
        }

        /* Рулетка */
        .roulette-wrapper {
            position: relative;
            background: #202126;
            border: 1px solid #363940;
            height: 120px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .roulette-track {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            transition: transform 5s cubic-bezier(0.15, 0.9, 0.15, 1);
        }
        .roulette-item {
            width: 120px;
            height: 100%;
            border-right: 1px solid #363940;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 12px;
            padding: 5px;
            text-align: center;
        }
        .roulette-item img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }
        .roulette-pointer {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background: #FFD700;
            z-index: 10;
            transform: translateX(-50%);
            box-shadow: 0 0 10px #FFD700;
        }

        .upgrade-info {
            background: #3A3F45;
            border: 1px solid #363940;
            padding: 16px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .upgrade-info .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .upgrade-info .row:last-child { margin-bottom: 0; }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: #3A3F45;
            border: 1px solid #363940;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        .modal-content h2 {
            font-size: 20px;
            margin-bottom: 16px;
        }
        .modal-content .result-skin {
            margin: 20px 0;
            padding: 16px;
            background: #202126;
            border: 1px solid #363940;
        }
        .modal-content .result-skin img {
            max-width: 100%;
            max-height: 150px;
            object-fit: contain;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-buttons .btn {
            margin-top: 0;
        }

        @media (max-width: 600px) {
            .shop-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
            .inv-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            h1 { font-size: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎰 Апгрейдер скинов OSNW</h1>

    <div class="balance">Баланс: <span class="gold" id="balanceDisplay">100</span> G</div>

    <div class="tabs">
        <div class="tab active" data-tab="shop">Магазин</div>
        <div class="tab" data-tab="inventory">Инвентарь</div>
    </div>

    <!-- МАГАЗИН -->
    <div class="section active" id="section-shop">
        <div class="shop-grid" id="shopGrid"></div>
        <button class="btn" id="rollBtn">🎲 Крутить рулетку</button>
    </div>

    <!-- ИНВЕНТАРЬ -->
    <div class="section" id="section-inventory">
        <div class="inventory-label">Твои скины:</div>
        <div class="inv-grid" id="invGrid"></div>

        <div class="upgrade-info">
            <div class="row">
                <span>Выбрано скинов:</span>
                <span id="selectedCount">0</span>
            </div>
            <div class="row">
                <span>Общая сумма:</span>
                <span class="gold" id="selectedSum">0</span> G
            </div>
        </div>

        <button class="btn" id="upgradeBtn" disabled>⬆️ Апгрейд</button>
        <button class="btn btn-danger" id="sellBtn" disabled>💰 Продать выбранные</button>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Результат</h2>
        <div class="result-skin" id="modalResult"></div>
        <div class="modal-buttons" id="modalButtons"></div>
    </div>
</div>

<script>
    // ============================================
    // КОНФИГУРАЦИЯ
    // ============================================
    const START_BALANCE = 100;

    // Шансы зависят от суммы вложенного
    function getChances(sum) {
        if (sum < 500) {
            return { base: 60, pro: 30, legend: 8, myth: 2 };
        } else if (sum < 2000) {
            return { base: 30, pro: 40, legend: 25, myth: 5 };
        } else if (sum < 10000) {
            return { base: 10, pro: 30, legend: 45, myth: 15 };
        } else {
            return { base: 0, pro: 15, legend: 50, myth: 35 };
        }
    }

    const QUALITY_NAMES = {
        base: 'Базовое',
        pro: 'Профессиональное',
        legend: 'Легендарное',
        myth: 'Мистическое'
    };

    // ============================================
    // СОСТОЯНИЕ
    // ============================================
    let state = {
        balance: START_BALANCE,
        inventory: []
    };

    let SKINS = [];
    let selectedSkins = new Set();

    // ============================================
    // ЗАГРУЗКА
    // ============================================
    function loadState() {
        const saved = localStorage.getItem('osnw_upgrader');
        if (saved) {
            try {
                state = JSON.parse(saved);
            } catch (e) {
                resetState();
            }
        }
    }

    function saveState() {
        localStorage.setItem('osnw_upgrader', JSON.stringify(state));
    }

    function resetState() {
        state = { balance: START_BALANCE, inventory: [] };
        saveState();
    }

    async function loadSkins() {
        try {
            const res = await fetch('skins.json');
            SKINS = await res.json();
        } catch (e) {
            console.error('Ошибка загрузки skins.json:', e);
            SKINS = [];
        }
    }

    // ============================================
    // UI
    // ============================================
    function updateBalance() {
        document.getElementById('balanceDisplay').textContent = state.balance;
    }

    function renderShop() {
        const grid = document.getElementById('shopGrid');
        grid.innerHTML = '';

        if (SKINS.length === 0) {
            grid.innerHTML = '<div class="empty">Скины не загружены</div>';
            return;
        }

        // В магазине показываем все скины (для теста — покупаешь любой)
        SKINS.forEach(skin => {
            const card = document.createElement('div');
            card.className = 'skin-card';
            card.innerHTML = `
                <div class="img">
                    <img src="${skin.image}" alt="${skin.name}" onerror="this.style.display='none'; this.parentElement.textContent='${skin.name}';">
                </div>
                <div class="name">${skin.name}</div>
                <div class="price">${skin.price} G</div>
                <div class="quality quality-${skin.quality}">${QUALITY_NAMES[skin.quality]}</div>
            `;
            card.addEventListener('click', () => buySkin(skin));
            grid.appendChild(card);
        });
    }

    function renderInventory() {
        const grid = document.getElementById('invGrid');
        grid.innerHTML = '';

        if (state.inventory.length === 0) {
            grid.innerHTML = '<div class="empty">Инвентарь пуст. Крути рулетку!</div>';
            return;
        }

        state.inventory.forEach((skin, index) => {
            const card = document.createElement('div');
            card.className = 'skin-card' + (selectedSkins.has(index) ? ' selected' : '');
            card.innerHTML = `
                <div class="img">
                    <img src="${skin.image}" alt="${skin.name}" onerror="this.style.display='none'; this.parentElement.textContent='${skin.name}';">
                </div>
                <div class="name">${skin.name}</div>
                <div class="price">${skin.price} G</div>
                <div class="quality quality-${skin.quality}">${QUALITY_NAMES[skin.quality]}</div>
            `;
            card.addEventListener('click', () => toggleSelect(index));
            grid.appendChild(card);
        });

        updateSelectionInfo();
    }

    function updateSelectionInfo() {
        const count = selectedSkins.size;
        let sum = 0;
        selectedSkins.forEach(i => {
            if (state.inventory[i]) sum += state.inventory[i].price;
        });

        document.getElementById('selectedCount').textContent = count;
        document.getElementById('selectedSum').textContent = sum;

        document.getElementById('upgradeBtn').disabled = count === 0;
        document.getElementById('sellBtn').disabled = count === 0;
    }

    function toggleSelect(index) {
        if (selectedSkins.has(index)) {
            selectedSkins.delete(index);
        } else {
            selectedSkins.add(index);
        }
        renderInventory();
    }

    // ============================================
    // ДЕЙСТВИЯ
    // ============================================
    function buySkin(skin) {
        if (state.balance < skin.price) {
            alert('Недостаточно голды!');
            return;
        }
        state.balance -= skin.price;
        state.inventory.push({ ...skin });
        saveState();
        updateBalance();
        renderInventory();
    }

    function sellSelected() {
        let sum = 0;
        const indices = Array.from(selectedSkins).sort((a,b) => b - a);
        indices.forEach(i => {
            if (state.inventory[i]) {
                sum += state.inventory[i].price;
                state.inventory.splice(i, 1);
            }
        });
        state.balance += sum;
        selectedSkins.clear();
        saveState();
        updateBalance();
        renderInventory();
        alert(`Продано на ${sum} G`);
    }

    function getRandomSkinByQuality(quality) {
        const filtered = SKINS.filter(s => s.quality === quality);
        if (filtered.length === 0) return null;
        return filtered[Math.floor(Math.random() * filtered.length)];
    }

    function pickQuality(chances) {
        const total = chances.base + chances.pro + chances.legend + chances.myth;
        const r = Math.random() * total;
        if (r < chances.base) return 'base';
        if (r < chances.base + chances.pro) return 'pro';
        if (r < chances.base + chances.pro + chances.legend) return 'legend';
        return 'myth';
    }

    function rollRoulette() {
        if (SKINS.length === 0) {
            alert('Скины не загружены');
            return;
        }

        // Игрок вкладывает 100 голды за крутку
        const BET = 100;
        if (state.balance < BET) {
            alert('Недостаточно голды (нужно 100 G)');
            return;
        }
        state.balance -= BET;

        const chances = getChances(BET);
        const quality = pickQuality(chances);
        const skin = getRandomSkinByQuality(quality);

        if (!skin) {
            alert('Не нашлось скина такого качества');
            state.balance += BET;
            return;
        }

        showRoulette(skin);
    }

    function showRoulette(resultSkin) {
        // Создаём полосу из случайных скинов + победный
        const track = document.createElement('div');
        track.className = 'roulette-track';

        const ITEMS = 50;
        const WIN_INDEX = 45;

        for (let i = 0; i < ITEMS; i++) {
            const item = document.createElement('div');
            item.className = 'roulette-item';
            let skin;
            if (i === WIN_INDEX) {
                skin = resultSkin;
            } else {
                skin = SKINS[Math.floor(Math.random() * SKINS.length)];
            }
            item.innerHTML = `
                <img src="${skin.image}" onerror="this.style.display='none';">
                <div style="position:absolute;bottom:5px;font-size:10px;">${skin.price} G</div>
            `;
            item.style.position = 'relative';
            track.appendChild(item);
        }

        // Открываем модалку
        const modal = document.getElementById('modal');
        const content = modal.querySelector('.modal-content');
        content.innerHTML = `
            <h2>Крутим...</h2>
            <div class="roulette-wrapper">
                <div class="roulette-pointer"></div>
                <div id="trackHolder"></div>
            </div>
        `;
        content.querySelector('#trackHolder').replaceWith(track);
        modal.classList.add('show');

        // Анимация
        const itemWidth = 120;
        const centerOffset = window.innerWidth > 600 ? 400 : 150;
        const finalX = -(WIN_INDEX * itemWidth) + centerOffset - itemWidth / 2;

        setTimeout(() => {
            track.style.transform = `translateX(${finalX}px)`;
        }, 100);

        // Результат
        setTimeout(() => {
            showResult(resultSkin);
        }, 5200);
    }

    function showResult(skin) {
        const modal = document.getElementById('modal');
        const content = modal.querySelector('.modal-content');

        content.innerHTML = `
            <h2>Выпал скин!</h2>
            <div class="result-skin">
                <img src="${skin.image}" onerror="this.style.display='none';">
                <div style="margin-top:10px; font-weight:700;">${skin.name}</div>
                <div class="quality quality-${skin.quality}">${QUALITY_NAMES[skin.quality]}</div>
                <div style="color:#FFD700; margin-top:6px;">${skin.price} G</div>
            </div>
            <div class="modal-buttons">
                <button class="btn" id="keepBtn">Оставить</button>
                <button class="btn btn-danger" id="sellResultBtn">Продать за ${skin.price}</button>
            </div>
        `;

        document.getElementById('keepBtn').addEventListener('click', () => {
            state.inventory.push({ ...skin });
            saveState();
            updateBalance();
            renderInventory();
            modal.classList.remove('show');
        });

        document.getElementById('sellResultBtn').addEventListener('click', () => {
            state.balance += skin.price;
            saveState();
            updateBalance();
            renderInventory();
            modal.classList.remove('show');
        });
    }

    function upgradeSelected() {
        if (selectedSkins.size === 0) return;

        let sum = 0;
        const indices = Array.from(selectedSkins).sort((a,b) => b - a);
        indices.forEach(i => {
            if (state.inventory[i]) sum += state.inventory[i].price;
        });

        const chances = getChances(sum);
        const quality = pickQuality(chances);
        const skin = getRandomSkinByQuality(quality);

        if (!skin) {
            alert('Не нашлось скина такого качества');
            return;
        }

        // Удаляем вложенные скины (теряются сразу)
        indices.forEach(i => {
            if (state.inventory[i]) state.inventory.splice(i, 1);
        });
        selectedSkins.clear();

        // Если выпало дороже суммы — повезло
        if (skin.price >= sum) {
            state.inventory.push({ ...skin });
            saveState();
            updateBalance();
            renderInventory();
            showUpgradeResult(skin, true);
        } else {
            // Не повезло — всё потеряно
            // Если совсем пусто — даём 100 голды
            if (state.inventory.length === 0 && state.balance === 0) {
                state.balance = START_BALANCE;
                saveState();
                updateBalance();
                renderInventory();
                showLoseMessage();
            } else {
                saveState();
                updateBalance();
                renderInventory();
                showUpgradeResult(skin, false);
            }
        }
    }

    function showUpgradeResult(skin, win) {
        const modal = document.getElementById('modal');
        const content = modal.querySelector('.modal-content');
        content.innerHTML = `
            <h2>${win ? '🎉 Повезло!' : '😢 Не повезло'}</h2>
            <div class="result-skin">
                <img src="${skin.image}" onerror="this.style.display='none';">
                <div style="margin-top:10px; font-weight:700;">${skin.name}</div>
                <div class="quality quality-${skin.quality}">${QUALITY_NAMES[skin.quality]}</div>
                <div style="color:#FFD700; margin-top:6px;">${skin.price} G</div>
            </div>
            <div class="modal-buttons">
                <button class="btn" id="closeModalBtn">ОК</button>
            </div>
        `;
        document.getElementById('closeModalBtn').addEventListener('click', () => {
            modal.classList.remove('show');
        });
        modal.classList.add('show');
    }

    function showLoseMessage() {
        const modal = document.getElementById('modal');
        const content = modal.querySelector('.modal-content');
        content.innerHTML = `
            <h2>😢 Ты всё проебал</h2>
            <p style="margin:16px 0; opacity:0.7;">Держи 100 голды на новый старт</p>
            <button class="btn" id="closeModalBtn">ОК</button>
        `;
        document.getElementById('closeModalBtn').addEventListener('click', () => {
            modal.classList.remove('show');
        });
        modal.classList.add('show');
    }

    // ============================================
    // ТАБЫ
    // ============================================
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById('section-' + tab.dataset.tab).classList.add('active');
        });
    });

    document.getElementById('rollBtn').addEventListener('click', rollRoulette);
    document.getElementById('sellBtn').addEventListener('click', sellSelected);
    document.getElementById('upgradeBtn').addEventListener('click', upgradeSelected);

    // ============================================
    // СТАРТ
    // ============================================
    async function init() {
        loadState();
        await loadSkins();
        updateBalance();
        renderShop();
        renderInventory();
    }

    init();
</script>

</body>
</html>
