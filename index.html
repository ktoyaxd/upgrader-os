<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSNW — Апгрейдер скинов</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #202126;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        h1 { font-size: 24px; letter-spacing: 2px; }
        .balance {
            background: #3A3F45;
            border: 1px solid #363940;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: 700;
        }
        .balance .gold { color: #FFD700; }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            background: #3A3F45;
            border: 1px solid #363940;
            color: #fff;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }
        .tab:hover { background: #363940; }
        .tab.active { background: #42474B; border-color: #FFFFFF; }

        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== АПГРЕЙД ===== */
        .upgrade-layout {
            display: grid;
            grid-template-columns: 1fr 340px 1fr;
            gap: 20px;
            align-items: start;
        }

        .slot {
            background: #3A3F45;
            border: 1px solid #363940;
            padding: 20px;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }
        .slot.filled {
            border-color: #FFD700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
        }
        .slot.target-filled {
            border-color: #6a8aff;
            box-shadow: 0 0 12px rgba(106, 138, 255, 0.3);
        }
        .slot-title {
            font-size: 13px;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .slot-img {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        .slot-img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .slot-placeholder {
            font-size: 14px;
            opacity: 0.4;
        }
        .slot-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .slot-price {
            font-size: 14px;
            color: #FFD700;
        }

        /* ===== КРУГ ===== */
        .roulette-box {
            background: #3A3F45;
            border: 1px solid #363940;
            padding: 20px;
            text-align: center;
        }
        .roulette-circle {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 20px;
        }
        .roulette-arrow {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 24px solid #FFD700;
            filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.8));
            z-index: 5;
        }
        .roulette-svg {
            width: 100%;
            height: 100%;
        }
        .roulette-svg.spinning {
            transition: transform 5s cubic-bezier(0.15, 0.9, 0.15, 1);
        }

        .stats {
            background: #202126;
            border: 1px solid #363940;
            padding: 14px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .stats .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .stats .row:last-child { margin-bottom: 0; }
        .stats .gold { color: #FFD700; }
        .stats .chance { color: #6a8aff; font-weight: 700; }
        .stats .mult { color: #FFD700; font-weight: 700; }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: #42474B;
            border: 1px solid #363940;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover:not(:disabled) { background: #363940; border-color: #FFFFFF; }
        .btn:disabled { opacity: 0.4; cursor: default; }
        .btn-clear {
            background: #2a1a1a;
            border-color: #5a2a2a;
            color: #ff6b6b;
            margin-top: 10px;
            font-size: 13px;
            padding: 8px;
        }
        .btn-clear:hover:not(:disabled) { background: #3a1a1a; border-color: #8a3a3a; }

        /* ===== СПИСОК СКИНОВ ===== */
        .skins-list {
            max-height: 500px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            padding: 4px;
        }
        .skin-mini {
            background: #202126;
            border: 1px solid #363940;
            padding: 6px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .skin-mini:hover {
            border-color: #FFFFFF;
            transform: translateY(-2px);
        }
        .skin-mini.selected {
            border-color: #FFD700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
        }
        .skin-mini.target-selected {
            border-color: #6a8aff;
            box-shadow: 0 0 8px rgba(106, 138, 255, 0.4);
        }
        .skin-mini .img {
            width: 100%;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
            font-size: 10px;
            opacity: 0.7;
        }
        .skin-mini .img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .skin-mini .name {
            font-size: 10px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .skin-mini .price {
            font-size: 10px;
            color: #FFD700;
        }

        /* ===== МАГАЗИН ===== */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }
        .shop-card {
            background: #3A3F45;
            border: 1px solid #363940;
            padding: 12px;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
        }
        .shop-card:hover {
            background: #363940;
            border-color: #FFFFFF;
            transform: translateY(-3px);
        }
        .shop-card .img {
            width: 100%;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #202126;
            border: 1px solid #363940;
            margin-bottom: 8px;
            font-size: 11px;
            opacity: 0.7;
        }
        .shop-card .img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .shop-card .name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
        .shop-card .price { font-size: 13px; color: #FFD700; }
        .shop-card .quality {
            font-size: 10px;
            margin-top: 4px;
            text-transform: uppercase;
        }
        .quality-base { color: #5AB0FF; }
        .quality-pro { color: #FF4444; }
        .quality-legend { color: #C060FF; }
        .quality-myth { color: #FFD700; }

        .empty {
            text-align: center;
            opacity: 0.5;
            padding: 20px;
            font-size: 13px;
        }

        /* ===== МОДАЛКА ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: #3A3F45;
            border: 1px solid #363940;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        .modal-content h2 { font-size: 20px; margin-bottom: 16px; }
        .modal-content .result-skin {
            margin: 20px 0;
            padding: 16px;
            background: #202126;
            border: 1px solid #363940;
        }
        .modal-content .result-skin img {
            max-width: 100%;
            max-height: 150px;
            object-fit: contain;
        }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .modal-buttons .btn { margin-top: 0; }

        @media (max-width: 900px) {
            .upgrade-layout { grid-template-columns: 1fr; }
            .roulette-box { order: 2; }
            .slot { min-height: 140px; padding: 14px; }
            .slot-img { width: 80px; height: 80px; }
        }
        @media (max-width: 600px) {
            h1 { font-size: 18px; }
            .roulette-circle { width: 220px; height: 220px; }
            .skins-list { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); }
            .shop-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="topbar">
        <h1>🎰 Апгрейдер OSNW</h1>
        <div class="balance">Баланс: <span class="gold" id="balanceDisplay">100</span> G</div>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="upgrade">Апгрейд</div>
        <div class="tab" data-tab="shop">Магазин</div>
    </div>

    <!-- АПГРЕЙД -->
    <div class="section active" id="section-upgrade">
        <div class="upgrade-layout">

            <!-- ЛЕВЫЙ ПАНЕЛЬ: ИНВЕНТАРЬ -->
            <div class="panel">
                <div style="font-size:13px;opacity:0.6;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;">
                    Твои скины
                </div>
                <div class="skins-list" id="invList"></div>
            </div>

            <!-- ЦЕНТР: РУЛЕТКА -->
            <div class="roulette-box">
                <div class="roulette-circle">
                    <div class="roulette-arrow"></div>
                    <svg class="roulette-svg" id="rouletteSvg" viewBox="0 0 200 200">
                        <circle cx="100" cy="100" r="95" fill="#202126" stroke="#363940" stroke-width="2"/>
                    </svg>
                </div>

                <div class="stats">
                    <div class="row">
                        <span>Вложено:</span>
                        <span class="gold" id="investedSum">0</span> G
                    </div>
                    <div class="row">
                        <span>Цель:</span>
                        <span class="gold" id="targetPrice">—</span> G
                    </div>
                    <div class="row">
                        <span>Множитель:</span>
                        <span class="mult" id="multiplierDisplay">—</span>
                    </div>
                    <div class="row">
                        <span>Шанс:</span>
                        <span class="chance" id="chanceDisplay">—</span>
                    </div>
                </div>

                <button class="btn" id="upgradeBtn" disabled>🎲 Апгрейд</button>
                <button class="btn btn-clear" id="clearBtn" disabled>Очистить</button>
            </div>

            <!-- ПРАВЫЙ ПАНЕЛЬ: ЦЕЛЬ -->
            <div class="panel">
                <div style="font-size:13px;opacity:0.6;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;">
                    Цель
                </div>
                <div class="skins-list" id="targetList"></div>
            </div>

        </div>
    </div>

    <!-- МАГАЗИН -->
    <div class="section" id="section-shop">
        <div class="shop-grid" id="shopGrid"></div>
    </div>
</div>

<!-- МОДАЛКА -->
<div class="modal" id="modal">
    <div class="modal-content" id="modalContent"></div>
</div>

<script>
    // ============================================
    // КОНФИГУРАЦИЯ
    // ============================================
    const START_BALANCE = 100;
    const UPGRADE_DURATION = 5000;

    const QUALITY_NAMES = {
        base: 'Базовое',
        pro: 'Профессиональное',
        legend: 'Легендарное',
        myth: 'Мистическое'
    };

    // ============================================
    // СОСТОЯНИЕ
    // ============================================
    let state = { balance: START_BALANCE, inventory: [] };
    let SKINS = [];
    let selectedSkin = null;   // скин из инвентаря (объект)
    let targetSkin = null;     // скин из общего списка (объект)

    // ============================================
    // ЗАГРУЗКА
    // ============================================
    function loadState() {
        const saved = localStorage.getItem('osnw_upgrader_v3');
        if (saved) {
            try { state = JSON.parse(saved); } catch (e) { resetState(); }
        }
    }
    function saveState() {
        localStorage.setItem('osnw_upgrader_v3', JSON.stringify(state));
    }
    function resetState() {
        state = { balance: START_BALANCE, inventory: [] };
        saveState();
    }
    async function loadSkins() {
        try {
            const res = await fetch('skins.json');
            SKINS = await res.json();
        } catch (e) { SKINS = []; }
    }

    // ============================================
    // UI
    // ============================================
    function updateBalance() {
        document.getElementById('balanceDisplay').textContent = state.balance;
    }

    function renderInventory() {
        const list = document.getElementById('invList');
        list.innerHTML = '';

        if (state.inventory.length === 0) {
            list.innerHTML = '<div class="empty">Инвентарь пуст</div>';
            return;
        }

        state.inventory.forEach((skin, index) => {
            const el = document.createElement('div');
            el.className = 'skin-mini' + (selectedSkin && selectedSkin._invIndex === index ? ' selected' : '');
            el.innerHTML = `
                <div class="img">
                    <img src="${skin.image}" onerror="this.style.display='none'; this.parentElement.textContent='${skin.name}';">
                </div>
                <div class="name">${skin.name}</div>
                <div class="price">${skin.price} G</div>
            `;
            el.addEventListener('click', () => {
                if (selectedSkin && selectedSkin._invIndex === index) {
                    selectedSkin = null;
                } else {
                    selectedSkin = { ...skin, _invIndex: index };
                }
                renderInventory();
                updateStats();
            });
            list.appendChild(el);
        });
    }

    function renderTargets() {
        const list = document.getElementById('targetList');
        list.innerHTML = '';

        if (SKINS.length === 0) {
            list.innerHTML = '<div class="empty">Скины не загружены</div>';
            return;
        }

        SKINS.forEach(skin => {
            const el = document.createElement('div');
            el.className = 'skin-mini' + (targetSkin && targetSkin.id === skin.id ? ' target-selected' : '');
            el.innerHTML = `
                <div class="img">
                    <img src="${skin.image}" onerror="this.style.display='none'; this.parentElement.textContent='${skin.name}';">
                </div>
                <div class="name">${skin.name}</div>
                <div class="price">${skin.price} G</div>
            `;
            el.addEventListener('click', () => {
                if (targetSkin && targetSkin.id === skin.id) {
                    targetSkin = null;
                } else {
                    targetSkin = skin;
                }
                renderTargets();
                updateStats();
            });
            list.appendChild(el);
        });
    }

    function renderShop() {
        const grid = document.getElementById('shopGrid');
        grid.innerHTML = '';

        if (SKINS.length === 0) {
            grid.innerHTML = '<div class="empty">Скины не загружены</div>';
            return;
        }

        SKINS.forEach(skin => {
            const el = document.createElement('div');
            el.className = 'shop-card';
            el.innerHTML = `
                <div class="img">
                    <img src="${skin.image}" onerror="this.style.display='none'; this.parentElement.textContent='${skin.name}';">
                </div>
                <div class="name">${skin.name}</div>
                <div class="price">${skin.price} G</div>
                <div class="quality quality-${skin.quality}">${QUALITY_NAMES[skin.quality]}</div>
            `;
            el.addEventListener('click', () => buySkin(skin));
            grid.appendChild(el);
        });
    }

    function updateStats() {
        const invested = selectedSkin ? selectedSkin.price : 0;
        const target = targetSkin ? targetSkin.price : 0;

        document.getElementById('investedSum').textContent = invested;
        document.getElementById('targetPrice').textContent = target || '—';

        const multEl = document.getElementById('multiplierDisplay');
        const chanceEl = document.getElementById('chanceDisplay');
        const btn = document.getElementById('upgradeBtn');
        const clearBtn = document.getElementById('clearBtn');

        if (invested > 0 && target > 0) {
            const mult = (target / invested).toFixed(2);
            let chance = (invested / target) * 100;
            if (chance > 90) chance = 90;
            if (chance < 1) chance = 1;

            multEl.textContent = 'x' + mult;
            chanceEl.textContent = chance.toFixed(1) + '%';
            btn.disabled = false;
            clearBtn.disabled = false;

            drawRoulette(chance);
        } else {
            multEl.textContent = '—';
            chanceEl.textContent = '—';
            btn.disabled = true;
            clearBtn.disabled = !selectedSkin && !targetSkin;

            drawRoulette(0);
        }
    }

    function buySkin(skin) {
        if (state.balance < skin.price) {
            alert('Недостаточно голды!');
            return;
        }
        state.balance -= skin.price;
        state.inventory.push({ ...skin });
        saveState();
        updateBalance();
        renderInventory();
    }

    function clearSelection() {
        selectedSkin = null;
        targetSkin = null;
        renderInventory();
        renderTargets();
        updateStats();
    }

    // ============================================
    // РУЛЕТКА (SVG)
    // ============================================
    function drawRoulette(chancePercent) {
        const svg = document.getElementById('rouletteSvg');
        svg.style.transition = 'none';
        svg.style.transform = 'rotate(0deg)';
        svg.innerHTML = `<circle cx="100" cy="100" r="95" fill="#202126" stroke="#363940" stroke-width="2"/>`;

        if (chancePercent <= 0) {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', '100');
            circle.setAttribute('cy', '100');
            circle.setAttribute('r', '40');
            circle.setAttribute('fill', '#3A3F45');
            circle.setAttribute('stroke', '#363940');
            svg.appendChild(circle);

            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', '100');
            text.setAttribute('y', '107');
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('font-size', '24');
            text.setAttribute('font-weight', '700');
            text.setAttribute('fill', '#5a6a8a');
            text.textContent = '—';
            svg.appendChild(text);
            return;
        }

        const winAngle = (chancePercent / 100) * 360;
        const loseAngle = 360 - winAngle;

        if (winAngle > 0) {
            const path = describeArc(100, 100, 90, 0, winAngle);
            const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            el.setAttribute('d', path);
            el.setAttribute('fill', 'rgba(255, 215, 0, 0.55)');
            el.setAttribute('stroke', '#FFD700');
            el.setAttribute('stroke-width', '1');
            svg.appendChild(el);
        }

        if (loseAngle > 0) {
            const path = describeArc(100, 100, 90, winAngle, 360);
            const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            el.setAttribute('d', path);
            el.setAttribute('fill', 'rgba(255, 68, 68, 0.35)');
            el.setAttribute('stroke', '#FF4444');
            el.setAttribute('stroke-width', '1');
            svg.appendChild(el);
        }

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', '100');
        circle.setAttribute('cy', '100');
        circle.setAttribute('r', '40');
        circle.setAttribute('fill', '#3A3F45');
        circle.setAttribute('stroke', '#363940');
        svg.appendChild(circle);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', '100');
        text.setAttribute('y', '107');
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('font-size', '20');
        text.setAttribute('font-weight', '700');
        text.setAttribute('fill', '#FFD700');
        text.textContent = chancePercent.toFixed(0) + '%';
        svg.appendChild(text);
    }

    function describeArc(cx, cy, r, startAngle, endAngle) {
        const start = polarToCartesian(cx, cy, r, endAngle);
        const end = polarToCartesian(cx, cy, r, startAngle);
        const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
        return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 0 ${end.x} ${end.y} Z`;
    }

    function polarToCartesian(cx, cy, r, angle) {
        const rad = (angle - 90) * Math.PI / 180;
        return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }

    // ============================================
    // АПГРЕЙД
    // ============================================
    function startUpgrade() {
        if (!selectedSkin || !targetSkin) return;

        const invested = selectedSkin.price;
        const target = targetSkin.price;

        let chance = (invested / target) * 100;
        if (chance > 90) chance = 90;
        if (chance < 1) chance = 1;

        const win = Math.random() * 100 < chance;

        // Куда остановится стрелка
        let stopAngle;
        if (win) {
            stopAngle = Math.random() * (chance / 100 * 360);
        } else {
            stopAngle = (chance / 100 * 360) + Math.random() * (360 - chance / 100 * 360);
        }

        const totalRotation = 5 * 360 + (360 - stopAngle);

        const svg = document.getElementById('rouletteSvg');
        svg.style.transition = 'none';
        svg.style.transform = 'rotate(0deg)';

        setTimeout(() => {
            svg.style.transition = `transform ${UPGRADE_DURATION}ms cubic-bezier(0.15, 0.9, 0.15, 1)`;
            svg.style.transform = `rotate(${totalRotation}deg)`;
        }, 50);

        document.getElementById('upgradeBtn').disabled = true;
        document.getElementById('clearBtn').disabled = true;

        setTimeout(() => {
            // Удаляем вложенный скин
            if (selectedSkin && selectedSkin._invIndex !== undefined) {
                state.inventory.splice(selectedSkin._invIndex, 1);
            }

            if (win) {
                state.inventory.push({ ...targetSkin });
                saveState();
                updateBalance();
                selectedSkin = null;
                targetSkin = null;
                renderInventory();
                renderTargets();
                updateStats();
                showResultModal(true, targetSkin || { name: '', image: '', price: 0, quality: 'base' });
                showResultModal(true, arguments[0] || targetSkin, true);
            } else {
                // Проверяем, всё ли потеряно
                if (state.inventory.length === 0 && state.balance === 0) {
                    state.balance = START_BALANCE;
                    saveState();
                    updateBalance();
                    selectedSkin = null;
                    targetSkin = null;
                    renderInventory();
                    renderTargets();
                    updateStats();
                    showLoseAllModal();
                } else {
                    saveState();
                    updateBalance();
                    selectedSkin = null;
                    targetSkin = null;
                    renderInventory();
                    renderTargets();
                    updateStats();
                    showResultModal(false, targetSkin);
                }
            }
        }, UPGRADE_DURATION + 200);
    }

    // ============================================
    // МОДАЛКИ
    // ============================================
    function showResultModal(win, skin) {
        const modal = document.getElementById('modal');
        const content = document.getElementById('modalContent');
        content.innerHTML = `
            <h2>${win ? '🎉 Повезло!' : '😢 Не повезло'}</h2>
            <div class="result-skin">
                <img src="${skin.image}" onerror="this.style.display='none';">
                <div style="margin-top:10px; font-weight:700;">${skin.name}</div>
                <div style="color:#FFD700; margin-top:6px;">${skin.price} G</div>
            </div>
            <div class="modal-buttons">
                <button class="btn" id="closeModalBtn">ОК</button>
            </div>
        `;
        document.getElementById('closeModalBtn').addEventListener('click', () => {
            modal.classList.remove('show');
        });
        modal.classList.add('show');
    }

    function showLoseAllModal() {
        const modal = document.getElementById('modal');
        const content = document.getElementById('modalContent');
        content.innerHTML = `
            <h2>😢 Ты всё проебал</h2>
            <p style="margin:16px 0; opacity:0.7;">Держи 100 голды на новый старт</p>
            <button class="btn" id="closeModalBtn">ОК</button>
        `;
        document.getElementById('closeModalBtn').addEventListener('click', () => {
            modal.classList.remove('show');
        });
        modal.classList.add('show');
    }

    // ============================================
    // ТАБЫ
    // ============================================
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById('section-' + tab.dataset.tab).classList.add('active');
        });
    });

    document.getElementById('upgradeBtn').addEventListener('click', startUpgrade);
    document.getElementById('clearBtn').addEventListener('click', clearSelection);

    // ============================================
    // СТАРТ
    // ============================================
    async function init() {
        loadState();
        await loadSkins();
        updateBalance();
        renderInventory();
        renderTargets();
        renderShop();
        updateStats();
    }

    init();
</script>

</body>
</html>
